# Konfigurácia pre Loki 3.x - Optimalizovaná pre Zabbix/Windows infraštruktúru
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retencia nastavená na 30 dní (720h)
  retention_period: 720h
  ingestion_rate_mb: 15
  ingestion_burst_size_mb: 30
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Povolenie štruktúrovaných metadát (dôležité pre Loki 3.x)
  allow_structured_metadata: true
  volume_enabled: true

# Compactor je kľúčový pre skutočné mazanie súborov z disku
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

analytics:
  reporting_enabled: false
