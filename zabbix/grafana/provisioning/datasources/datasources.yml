apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST

  - name: Zabbix-Alexander
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-frontend:8080/api_jsonrpc.php
    basicAuth: false
    isDefault: false
    editable: true
    jsonData:
      username: Admin
      password: Heslo-123456
      trendCache: true
      trendFrom: 7d
      cacheTTL: 1h
  - name: Loki
    type: loki
    access: proxy
    # Nahraď 'localhost' IP adresou alebo názvom kontajnera, kde ti beží Loki
    url: http://zabbix-loki:3100
    jsonData:
      # Voliteľné: nastavenie maximálneho počtu riadkov (default je 1000)
      maxLines: 1000
    # Ak nepotrebuješ autentifikáciu, nechaj basicAuth: false
    basicAuth: false
    editable: true
