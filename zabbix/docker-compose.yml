networks:
  zabbix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  postgres-data:
    external: true
    name: zabbix-postgres-data
  grafana-data:
    external: true
    name: zabbix-grafana-data
  loki-data:
    external: true
    name: zabbix-loki-data
  prometheus-data:     # Nový volume pre metriky
    external: true
    name: zabbix-prometheus-data
  zabbix-alertscripts:
  zabbix-externalscripts:
  zabbix-modules:
  zabbix-enc:
  zabbix-ssh-keys:
  zabbix-ssl-certs:
  zabbix-ssl-keys:
  zabbix-ssl-ssl-ca:
  zabbix-snmptraps:

services:

  # PostgreSQL Database
  postgres:
    image: postgres:15.15-alpine
    container_name: zabbix-postgres
    hostname: zabbix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    shm_size: 256m
    restart: unless-stopped
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zabbix} -d ${POSTGRES_DB:-zabbix}"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    labels:
      - 'wud.tag.include=^15\.\d+$'
      - 'wud.watch=true'

  # SNMP Trap Daemon - Dôležité pre UPS a sieťové prvky
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:ubuntu-7.4-latest
    container_name: zabbix-snmptraps
    hostname: zabbix-snmptraps
    ports:
      - "1162:1162/udp"
    environment:
      MIBS: SNMPv2-MIB:IF-MIB:HOST-RESOURCES-MIB:FORTINET-FORTIGATE-MIB:SYNOLOGY-SYSTEM-MIB:UBNT-UniFi-MIB:RIELLO-MIB:MERAKI-CLOUD-CONTROLLER-MIB
    volumes:
      - zabbix-snmptraps:/var/lib/zabbix/snmptraps:rw
      - /srv/zabbix/zabbix-server/mibs:/usr/share/snmp/mibs:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - zabbix-net
    labels:
      - 'wud.tag.include=^ubuntu-7\.\d+\.\d+$'
      - 'wud.watch=true'

  # Zabbix Server - Váš Custom Build s Chromom
  zabbix-server:
    build:
      context: ./zabbix-server
      dockerfile: Dockerfile.ubuntu-chrome
    container_name: zabbix-server
    hostname: zabbix-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      ZBX_ENABLE_SNMP_TRAPS: "true"
      # Posilnené pollery pre SNMP a Ping (UPS, Tlačiarne, Fortinet)
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS:-20}
      ZBX_STARTTRAPPERS: ${ZBX_STARTTRAPPERS:-15}
      ZBX_STARTPINGERS: ${ZBX_STARTPINGERS:-10}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-256M}
      ZBX_VALUECACHESIZE: ${ZBX_VALUECACHESIZE:-128M}
      ZBX_TIMEOUT: ${ZBX_TIMEOUT:-30}
      ZBX_TRENDCACHESIZE: 128M
      ZBX_HOUSEKEEPINGFREQUENCY: 0
      ZBX_STARTREPORTWRITERS: 3
      ZBX_WEBSERVICEURL: "http://zabbix-web-service:10053/report"
      TZ: ${TZ:-Europe/Bratislava}
      MIBS: SNMPv2-MIB:IF-MIB:HOST-RESOURCES-MIB:FORTINET-FORTIGATE-MIB:SYNOLOGY-SYSTEM-MIB:UBNT-UniFi-MIB:RIELLO-MIB:MERAKI-CLOUD-CONTROLLER-MIB
    ports:
      - "10051:10051"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - zabbix-alertscripts:/usr/lib/zabbix/alertscripts:ro
      - zabbix-externalscripts:/usr/lib/zabbix/externalscripts:ro
      - zabbix-snmptraps:/var/lib/zabbix/snmptraps:ro
      - /srv/zabbix/zabbix-server/mibs:/usr/share/snmp/mibs:ro
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-snmptraps:
        condition: service_started
    restart: unless-stopped
    networks:
      - zabbix-net
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}"
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "zabbix_server -R config_cache_reload || exit 1"]
    labels:
      - 'wud.tag.include=^ubuntu-7\.\d+\.\d+$'
      - 'wud.watch=true'
      - 'wud.display.name=Zabbix Server (Custom)'
      - 'wud.link=https://github.com/zabbix/zabbix/releases'

  # Zabbix Web Interface - OPRAVA ERROR 500
  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.4-latest
    container_name: zabbix-frontend
    hostname: zabbix-frontend
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${PHP_TZ:-Europe/Bratislava}
      # Navýšená pamäť pre PHP, aby Latest Data nezlyhávalo
      ZBX_MEMORYLIMIT: 1024M
      ZBX_MAXEXECUTIONTIME: 600
      ZBX_POSTMAXSIZE: 32M
    ports:
      - "8080:8080"
    depends_on:
      zabbix-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]

  # Zabbix Web Service (pre PDF reporty)
  zabbix-web-service:
    image: zabbix/zabbix-web-service:ubuntu-7.4-latest
    container_name: zabbix-web-service
    environment:
      ZBX_ALLOWEDIP: 172.18.0.0/16
    restart: unless-stopped
    networks:
      - zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    hostname: zabbix-agent
    privileged: false
    pid: host
    environment:
      #ZBX_HOSTNAME: zabbix-server
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_HOSTMETADATA: ${ZBX_HOSTMETADATA:-Linux docker}
      ZBX_DEBUGLEVEL: ${ZBX_DEBUGLEVEL:-3}
      ZBX_PLUGINS_POSTGRESQL_SESSIONS_PG_URI: tcp://zabbix-postgres:5432
      ZBX_PLUGINS_POSTGRESQL_SESSIONS_PG_USER: zbx_monitor
      ZBX_PLUGINS_POSTGRESQL_SESSIONS_PG_PASSWORD: "Karabin@-K0sice"
      TZ: ${TZ:-Europe/Bratislava}
    user: root
    ports:
      - "10055:10050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
      - /var/run:/var/run:ro
      - /srv/zabbix/zabbix-agent/zabbix_agent2.conf:/etc/zabbix/zabbix_agent2.conf:ro
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      - zabbix-server
    labels:
      - 'wud.tag.include=^ubuntu-7.0\.\d+$' # Sleduje iba stabilné 7.x.x verzie
      - 'wud.watch=true'
      # wud.trigger.docker.local.enabled REMOVED

  # Grafana - Priamo napojená na Zabbix API
  grafana:
    image: grafana/grafana:11.6-ubuntu
    container_name: grafana
    environment:
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PANELS_DISABLE_SANITIZE_HTML: true
      TZ: ${TZ:-Europe/Bratislava}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - zabbix-net

  # Loki (Logy zo sieťových prvkov a Linuxu)
  loki:
    image: grafana/loki:latest
    container_name: zabbix-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped
    networks:
      - zabbix-net
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$'
      - 'wud.watch=true'

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    hostname: promtail
    ports:
      - "9080:9080"
    volumes:
      - ./loki:/etc/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      - loki
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$'
      - 'wud.watch=true'

# Prometheus - Zberateľ metrík z Windows Serverov
  prometheus:
    image: prom/prometheus:latest
    container_name: zabbix-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - zabbix-net
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$'
      - 'wud.watch=true'
